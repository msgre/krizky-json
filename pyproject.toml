[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krizky-json"
version = "0.1.0"
description = "JSON export plugin for krizky static site generator"
requires-python = ">=3.12"
dependencies = [
    "krizky>=0.1",
]

[project.entry-points."krizky"]
json = "krizky_json.plugin:plugin"

[tool.hatch.build.targets.wheel]
packages = ["krizky_json"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
